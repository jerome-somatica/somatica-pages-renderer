      var v = p.get(k);
      if (v) localStorage.setItem('somatica_' + k, v);
    });
    // Premier referrer pour attribution
    if (!localStorage.getItem('somatica_first_referrer') && document.referrer) {
      try { localStorage.setItem('somatica_first_referrer', document.referrer); } catch(e){}
    }
    if (!localStorage.getItem('somatica_landing_page')) {
      try { localStorage.setItem('somatica_landing_page', window.location.pathname + window.location.search); } catch(e){}
    }
  } catch(e){}
})();
</script>

<style>
  /* THEME PAR DÉFAUT : pro Jérôme (vert sombre + doré chaud) — utilisé pour ISS et autres */
  :root {
    --dore-fonce: #8a6d2e;
    --dore-clair: #ebd3a0;
    --vert-sombre: #0f2f3a;
    --fond-sombre: #1c2a30;
    --fond-creme: #f5efe2;
    --texte: #1a1a1a;
    --gris: #4a4a4a;
    --font-titre: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-corps: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-italic: 'Inter', sans-serif;
    --radius: 6px;
    --radius-card: 8px;
    --shadow: 0 8px 24px rgba(15, 47, 58, 0.12);
    --highlight-style: italic;
  }

  /* THEME FÉMININ SOMATICA : bordeaux + rose poudré + doré chaud + serif élégante */
  /* Appliqué automatiquement aux pages tunnel = seances ou formation */
  body.theme-feminin {
    --dore-fonce: #c4956c;        /* Doré chaud rose */
    --dore-clair: #ead4c8;        /* Rose poudré clair */
    --vert-sombre: #3a1a26;       /* Bordeaux profond (remplace vert) */
    --fond-sombre: #5d2837;       /* Bordeaux Somatica (rouge du logo) */
    --fond-creme: #faf2e8;        /* Crème rosée */
    --texte: #3a1a26;             /* Bordeaux profond pour le texte */
    --gris: #7a5a55;              /* Gris chaud rosé */
    --font-titre: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
    --font-corps: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-italic: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    --radius: 8px;
    --radius-card: 12px;
    --shadow: 0 12px 36px rgba(93, 40, 55, 0.15);
  }

  /* Application des fontes selon thème */
  body.theme-feminin h1,
  body.theme-feminin h2,
  body.theme-feminin h3 {
    font-family: var(--font-titre);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  body.theme-feminin .hero h1 .highlight {
    font-family: var(--font-italic);
    font-style: italic;
    font-weight: 500;
  }
  body.theme-feminin .hero-sub,
  body.theme-feminin .section-intro,
  body.theme-feminin .beneficies-intro,
  body.theme-feminin .pour-qui-intro {
    font-family: var(--font-italic);
    font-style: italic;
  }
  body.theme-feminin .hero-label,
  body.theme-feminin .programme-num,
  body.theme-feminin .benefice-num,
  body.theme-feminin .programme-label,
  body.theme-feminin .gardefous-titre,
  body.theme-feminin .faq-cat-titre,
  body.theme-feminin .tarif-section-titre {
    font-family: var(--font-corps);
    font-weight: 500;
    letter-spacing: 0.18em;
  }
  body.theme-feminin .temoignage-texte {
    font-family: var(--font-italic);
    font-style: italic;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-corps);
    background: var(--fond-creme);
    color: var(--texte);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== ANIMATIONS FADE-IN AU SCROLL ===== */
  .fade-in-section {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.9s cubic-bezier(0.215, 0.61, 0.355, 1), transform 0.9s cubic-bezier(0.215, 0.61, 0.355, 1);
  }
  .fade-in-section.visible {
    opacity: 1;
    transform: translateY(0);
  }
  /* Le Hero ne fait pas de fade-in (visible au load) */
  .hero { opacity: 1 !important; transform: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .fade-in-section { opacity: 1; transform: none; transition: none; }
  }

  /* ===== STICKY NAV ===== */
  .sticky-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(28, 42, 48, 0); backdrop-filter: blur(0);
    transition: background 0.3s, backdrop-filter 0.3s, padding 0.3s;
    padding: 1.2rem 1.5rem;
    pointer-events: none;
  }
  .sticky-nav.visible { background: rgba(28, 42, 48, 0.92); backdrop-filter: blur(12px); padding: 0.7rem 1.5rem; pointer-events: all; }
  body.theme-feminin .sticky-nav.visible { background: rgba(58, 26, 38, 0.92); }
  .sticky-nav-inner { max-width: 1080px; margin: 0 auto; display: flex; gap: 1.5rem; justify-content: center; align-items: center; flex-wrap: wrap; opacity: 0; transition: opacity 0.3s; }
  .sticky-nav.visible .sticky-nav-inner { opacity: 1; }
  .sticky-nav a { color: var(--dore-clair); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.05em; font-weight: 500; padding: 0.4rem 0.6rem; transition: color 0.2s; }
  .sticky-nav a:hover { color: var(--dore-fonce); }
  .sticky-nav a.cta { background: var(--dore-fonce); color: var(--vert-sombre); padding: 0.5rem 1.1rem; border-radius: 999px; font-weight: 700; }
  .sticky-nav a.cta:hover { background: var(--dore-clair); color: var(--vert-sombre); }
  @media (max-width: 720px) { .sticky-nav-inner { gap: 0.8rem; } .sticky-nav a { font-size: 0.75rem; padding: 0.3rem 0.4rem; } .sticky-nav a:not(.cta) { display: none; } }

  /* Smooth scroll natif */
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }

  /* ===== PROGRESS BAR DE SCROLL EN HAUT ===== */
  .scroll-progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    background: linear-gradient(90deg, var(--dore-fonce), var(--dore-clair));
    z-index: 200; transition: width 0.1s;
  }

  /* ===== STATS COUNT (compteurs animés) ===== */
  .stats-count-section { background: var(--fond-creme); padding: 4rem 1.5rem; }
  body.theme-feminin .stats-count-section { background: var(--fond-creme); }
  .stats-count-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 2rem; max-width: 920px; margin: 0 auto; text-align: center; }
  .stats-count-item .num { font-size: clamp(2.4rem, 5vw, 3.6rem); font-weight: 700; color: var(--dore-fonce); font-family: var(--font-titre); line-height: 1; margin-bottom: 0.4rem; display: block; }
  .stats-count-item .label { font-size: 0.85rem; letter-spacing: 0.12em; color: var(--gris); text-transform: uppercase; font-weight: 500; }

  /* ===== GALLERY ===== */
  .gallery-section { background: var(--fond-creme); padding: 5rem 1.5rem; }
  body.theme-feminin .gallery-section { background: var(--fond-creme); }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.8rem; max-width: 1200px; margin: 0 auto; }
  .gallery-item { aspect-ratio: 1; overflow: hidden; border-radius: var(--radius-card); background: var(--vert-sombre); transition: transform 0.4s ease; cursor: pointer; }
  .gallery-item:hover { transform: scale(1.03); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s ease; }
  .gallery-item:hover img { transform: scale(1.08); }
  .gallery-item.feature { grid-column: span 2; grid-row: span 2; aspect-ratio: 1; }
  @media (max-width: 720px) { .gallery-item.feature { grid-column: span 2; grid-row: auto; } }
  /* Border-radius et shadow pilotés par variables thème */
  .benefice, .programme-etape, .a-propos-image, .texte-image, .gardefous-bloc,
  .tarif-card, .temoignage-video, .faq-item {
    border-radius: var(--radius-card);
  }
  body.theme-feminin .hero-cta,
  body.theme-feminin .form-cta,
  body.theme-feminin .tarif-cta {
    border-radius: 999px;  /* Boutons arrondis style premium */
    padding-left: 2.4rem;
    padding-right: 2.4rem;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  body.theme-feminin .hero::before {
    background: radial-gradient(ellipse at top, var(--hero-glow, rgba(196, 149, 108, 0.25)), transparent 70%);
  }
  body.theme-feminin .hero-with-image {
    /* Overlay plus chaud (bordeaux) au lieu du vert */
  }

  /* HERO */
  .hero { background: var(--fond-sombre); color: var(--dore-clair); padding: 6rem 1.5rem 5rem; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at top, var(--hero-glow, rgba(138, 109, 46, 0.15)), transparent 60%); pointer-events: none; }
  .hero-with-image { padding: 8rem 1.5rem 7rem; min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .hero-inner { position: relative; max-width: 720px; margin: 0 auto; }
  .hero-label { font-size: 0.85rem; letter-spacing: 0.2em; color: var(--dore-fonce); font-weight: 700; margin-bottom: 1rem; }
  .hero-trait { width: 3rem; height: 1.5px; background: var(--dore-fonce); margin: 0 auto 1.8rem; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; color: var(--dore-clair); line-height: 1.2; margin-bottom: 1.2rem; letter-spacing: -0.01em; }
  .hero h1 .highlight { color: var(--dore-fonce); font-style: italic; font-weight: 500; }
  .hero-sub { font-size: clamp(1rem, 2vw, 1.25rem); color: rgba(235, 211, 160, 0.85); margin-bottom: 2.5rem; line-height: 1.6; }
  .hero-cta { display: inline-block; background: var(--dore-fonce); color: var(--vert-sombre); padding: 1rem 2.2rem; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; transition: transform 0.2s, background 0.2s; border: 0; cursor: pointer; }
  .hero-cta:hover, .hero-cta:focus { background: var(--dore-clair); transform: translateY(-1px); }
  .hero-meta { margin-top: 1.5rem; font-size: 0.85rem; color: rgba(235, 211, 160, 0.55); font-style: italic; }
  .hero-tap { cursor: pointer; }

  .hero-bigplay { position: absolute; top: 33%; left: 50%; transform: translate(-50%, -50%); width: min(94vw, 470px); color: rgba(246,230,200,0.42); pointer-events: none; z-index: 1; filter: drop-shadow(0 2px 14px rgba(0,0,0,0.45)); transition: opacity .6s ease; animation: heroHpPulse 3.2s ease-in-out infinite; }
  .hero-hp { width: 100%; height: auto; display: block; }
  .hero.audio-on .hero-bigplay { animation: none; opacity: 0.04; }
  .hero-tap-cue { font-family: var(--font-italic, 'Cormorant Garamond', Georgia, serif); font-style: italic; font-size: 0.98rem; color: rgba(235,211,160,0.75); letter-spacing: .03em; margin-top: 1rem; }
  @keyframes heroHpPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; } 50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; } }

  section { padding: 4rem 1.5rem; }

  /* Garde-fous */
  .gardefous { background: var(--fond-creme); text-align: center; padding: 3rem 1.5rem; }
  .gardefous-bloc { max-width: 580px; margin: 0 auto; border: 1px solid rgba(138, 109, 46, 0.2); border-radius: 6px; padding: 1.8rem 1.5rem; background: white; text-align: left; }
  .gardefous-titre { color: var(--dore-fonce); font-size: 0.85rem; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 0.7rem; }
  .gardefous p { color: var(--gris); font-size: 0.92rem; line-height: 1.65; }

  /* Footer */
  footer { background: var(--vert-sombre); padding: 2.5rem 1.5rem; text-align: center; color: rgba(235, 211, 160, 0.6); font-size: 0.85rem; }
  footer a { color: var(--dore-clair); text-decoration: none; }
  .footer-trait { width: 2rem; height: 1px; background: var(--dore-fonce); margin: 1rem auto; }

  /* Texte bloc */
  .texte-section { background: var(--fond-creme); }
  .texte-section h2 { font-size: 1.8rem; color: var(--vert-sombre); margin-bottom: 1.5rem; text-align: center; }
  .texte-section p { color: var(--gris); margin-bottom: 1rem; }
  .texte-section .container { text-align: center; }

  /* Sections génériques */
  .container-large { max-width: 1080px; margin: 0 auto; }
  .section-titre { font-size: 1.8rem; color: var(--vert-sombre); text-align: center; margin-bottom: 0.8rem; font-weight: 700; }
  .section-intro { text-align: center; color: var(--gris); margin-bottom: 3rem; font-size: 1.05rem; max-width: 640px; margin-left: auto; margin-right: auto; }

  /* Programme */
  .programme-section { background: var(--fond-creme); }
  .programme-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 720px) { .programme-grid { grid-template-columns: repeat(2, 1fr); } }
  .programme-etape { background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 12px rgba(15, 47, 58, 0.08); display: flex; flex-direction: column; }
  .programme-image { width: 100%; aspect-ratio: 16/9; overflow: hidden; }
  .programme-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .programme-content { padding: 2rem 1.8rem; border-top: 3px solid var(--dore-fonce); flex: 1; }
  .programme-num { font-size: 0.85rem; letter-spacing: 0.15em; color: var(--dore-fonce); font-weight: 700; margin-bottom: 0.6rem; }
  .programme-etape h3 { font-size: 1.4rem; color: var(--vert-sombre); margin-bottom: 0.4rem; line-height: 1.3; }
  .programme-sous-titre { color: var(--gris); font-style: italic; font-size: 0.95rem; margin-bottom: 1.5rem; }
  .programme-bloc { margin-top: 1rem; }
  .programme-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dore-fonce); font-weight: 700; margin-bottom: 0.4rem; }
  .programme-bloc p { font-size: 0.95rem; color: var(--texte); line-height: 1.6; }
  .programme-bloc ul { list-style: none; padding-left: 0; }
  .programme-bloc li { font-size: 0.95rem; color: var(--texte); padding: 0.3rem 0 0.3rem 1.2rem; position: relative; line-height: 1.5; }
  .programme-bloc li::before { content: "▸"; position: absolute; left: 0; color: var(--dore-fonce); font-weight: 700; }
  .programme-resultat { padding-top: 1rem; border-top: 1px solid var(--bordure, #e0d8c8); margin-top: 1.2rem; }

  /* Tarif */
  .tarif-section { background: var(--vert-sombre); color: var(--dore-clair); padding: 5rem 1.5rem; }
  .tarif-section .section-titre { color: var(--dore-clair); }
  .tarif-section .section-intro { color: rgba(235, 211, 160, 0.75); }
  .tarif-card { background: rgba(245, 239, 226, 0.06); border: 1px solid rgba(235, 211, 160, 0.18); border-radius: 8px; padding: 2.5rem 2rem; max-width: 640px; margin: 0 auto; }
  .tarif-section-titre { font-size: 0.85rem; letter-spacing: 0.12em; color: var(--dore-fonce); font-weight: 700; margin-bottom: 1.2rem; text-transform: uppercase; }
  .tarif-liste { list-style: none; padding: 0; margin-bottom: 1.5rem; }
  .tarif-liste li { display: flex; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid rgba(235, 211, 160, 0.1); font-size: 0.95rem; gap: 1rem; }
  .tarif-liste li:last-child { border-bottom: none; }
  .tarif-item-label { color: rgba(235, 211, 160, 0.9); }
  .tarif-item-valeur { color: var(--dore-fonce); font-weight: 700; flex-shrink: 0; }
  .tarif-valeur-totale { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-top: 2px dashed var(--dore-fonce); margin-bottom: 1.5rem; }
  .tarif-valeur-totale span { font-size: 0.85rem; letter-spacing: 0.05em; color: rgba(235, 211, 160, 0.7); }
  .tarif-valeur-totale strong { font-size: 1.4rem; color: var(--dore-clair); }
  .tarif-prix-bloc { text-align: center; padding: 1.5rem 0; }
  .tarif-prix-normal { font-size: 1rem; color: rgba(235, 211, 160, 0.5); text-decoration: line-through; margin-bottom: 0.4rem; }
  .tarif-prix { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .tarif-prix-amount { font-size: 2.5rem; font-weight: 700; color: var(--dore-fonce); line-height: 1; }
  .tarif-prix-label { font-size: 0.85rem; color: rgba(235, 211, 160, 0.7); letter-spacing: 0.05em; }
  .tarif-modalites { font-size: 0.85rem; color: rgba(235, 211, 160, 0.6); margin-top: 0.8rem; font-style: italic; }
  .tarif-option { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: rgba(245, 239, 226, 0.04); border-radius: 4px; margin: 1.5rem 0; font-size: 0.92rem; gap: 1rem; }
  .tarif-option span { color: rgba(235, 211, 160, 0.85); }
  .tarif-option strong { color: var(--dore-fonce); flex-shrink: 0; }
  .tarif-cta { display: block; text-align: center; background: var(--dore-fonce); color: var(--vert-sombre); padding: 1.1rem 2rem; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 1.05rem; transition: background 0.2s, transform 0.2s; }
  .tarif-cta:hover { background: var(--dore-clair); transform: translateY(-1px); }

  /* FAQ */
  .faq-section { background: var(--fond-creme); padding: 5rem 1.5rem; }
  .faq-cat { margin-bottom: 2.5rem; }
  .faq-cat:last-child { margin-bottom: 0; }
  .faq-cat-titre { font-size: 0.85rem; letter-spacing: 0.15em; color: var(--dore-fonce); font-weight: 700; text-transform: uppercase; margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--dore-fonce); }
  .faq-item { background: white; border-radius: 4px; margin-bottom: 0.7rem; padding: 0; overflow: hidden; }
  .faq-item summary { padding: 1.2rem 1.5rem; cursor: pointer; font-weight: 700; color: var(--vert-sombre); font-size: 1rem; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after { content: "+"; color: var(--dore-fonce); font-size: 1.5rem; font-weight: 400; flex-shrink: 0; transition: transform 0.2s; }
  .faq-item[open] summary::after { transform: rotate(45deg); }
  .faq-item p { padding: 0 1.5rem 1.4rem; color: var(--gris); line-height: 1.7; font-size: 0.95rem; margin: 0; }

  /* Loading */
  .loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--gris); font-style: italic; }
</style>
</head>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.0';

  const SUPABASE_URL = 'https://zrdlvoovrnglxcgoyyeb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ukrn7WQHygY5FUtNiMxxfA_E-esyAUs';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Récupère la query qui identifie la page : ?slug=X, ou path /X, ou défaut.
  // La résolution par sous-domaine se fait via .eq('sous_domaine', ...) en DB (sp_pages.sous_domaine)
  function getSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    const slugParam = urlParams.get('slug');
    if (slugParam) return slugParam;

    const path = window.location.pathname.replace(/^\/|\/$/g, '');
    if (path) return path;

    return null; // null = résoudre par sous-domaine
  }

  // Extrait le sous-domaine racine (formation, seances, etc.) ou null
  function getSubdomain() {
    const host = window.location.hostname;
    const parts = host.split('.');
    // Cas : formation.somatica.fr → "formation"
    // Cas : somatica.fr ou www.somatica.fr → null
    if (parts.length >= 3 && parts[parts.length - 2] === 'somatica' && parts[parts.length - 1] === 'fr') {
      const sub = parts[0];
      if (sub && sub !== 'www') return sub;
    }
    return null;
  }

  // Échappement HTML basique
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // ====== TEMPLATING DYNAMIQUE pour blocs custom (sp_block_types) ======
  // Syntaxe : {{ key }} → escape, {{{ key }}} → raw HTML
  // {{#each items}} ... {{/each}} → boucle (this = item courant, scope props parent accessible)
  // {{#if key}} ... {{/if}} → si truthy
  function renderCustomBlock(template, props) {
    // 1. Boucles {{#each items}} ... {{/each}}
    let html = template.replace(/\{\{#each\s+(\w+)\s*\}\}([\s\S]*?)\{\{\/each\}\}/g, (_, key, inner) => {
      const arr = props[key];
      if (!Array.isArray(arr)) return '';
      return arr.map(item => {
        const merged = (typeof item === 'object' && item !== null) ? { ...props, ...item, this: item } : { ...props, this: item };
        return renderCustomBlock(inner, merged);
      }).join('');
    });
    // 2. Conditionnels {{#if key}} ... {{/if}}
    html = html.replace(/\{\{#if\s+(\w+)\s*\}\}([\s\S]*?)\{\{\/if\}\}/g, (_, key, inner) => {
      return props[key] ? renderCustomBlock(inner, props) : '';
    });
    // 3. Variables raw {{{ key }}}
    html = html.replace(/\{\{\{\s*([\w.]+)\s*\}\}\}/g, (_, path) => {
      const v = path.split('.').reduce((o, k) => (o == null ? '' : o[k]), props);
      return v == null ? '' : String(v);
    });
    // 4. Variables escapées {{ key }}
    html = html.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, path) => {
      const v = path.split('.').reduce((o, k) => (o == null ? '' : o[k]), props);
      return v == null ? '' : esc(String(v));
    });
    return html;
  }

  // Renderers par type de bloc
  const renderers = {
    hero(p) {
      const titreL1 = p.titre_ligne1 || '';
      const titreH = p.titre_highlight ? `<span class="highlight">${esc(p.titre_highlight)}</span>` : '';
      const titreL2 = p.titre_ligne2 || '';
      // Construction du fond Hero en couches superposées (top → bottom dans cet ordre CSS)
      // Priorité au champ overlay_image_url si fourni (PNG transparent custom)
      // Sinon dégradé CSS adaptatif au thème
      const isF = document.body.classList.contains('theme-feminin');
      const bgLayers = [];

      // Couche 1 (top) : overlay PNG custom si fourni dans les props
      if (p.overlay_image_url) {
        bgLayers.push(`url('${esc(p.overlay_image_url)}')`);
      } else if (p.overlay_color) {
        // Voile uni réglable par page : couleur "R,G,B" + opacité 0..1
        const ovOp = (p.overlay_opacity != null && p.overlay_opacity !== '') ? p.overlay_opacity : 0.5;
        const ovCol = esc(String(p.overlay_color));
        bgLayers.push(`linear-gradient(rgba(${ovCol},${ovOp}), rgba(${ovCol},${ovOp}))`);
      } else {
        // Dégradé CSS de fallback selon le thème
        if (isF) {
          bgLayers.push('radial-gradient(ellipse at 50% 18%, rgba(196,149,108,0.22) 0%, transparent 60%)');
          bgLayers.push('linear-gradient(180deg, rgba(58,26,38,0.45) 0%, rgba(122,56,72,0.35) 30%, rgba(93,40,55,0.65) 65%, rgba(58,26,38,0.92) 100%)');
        } else {
          bgLayers.push('radial-gradient(ellipse at 50% 20%, rgba(138,109,46,0.18) 0%, transparent 60%)');
          bgLayers.push('linear-gradient(180deg, rgba(15,47,58,0.55) 0%, rgba(28,42,48,0.45) 30%, rgba(15,47,58,0.7) 65%, rgba(15,47,58,0.92) 100%)');
        }
      }

      // Couche 2 (bot) : image de fond
      if (p.image_url) {
        bgLayers.push(`url('${esc(p.image_url)}')`);
      }

      // Tailles : overlay full cover, image cover. Position : center pour les 2.
      // background-blend-mode optionnel via prop
      const blendMode = p.overlay_blend_mode || 'normal';
      const glowOverride = p.overlay_color ? '--hero-glow: transparent; ' : '';
      const bgStyle = bgLayers.length > 0
        ? `style="${glowOverride}background-image: ${bgLayers.join(', ')}; background-size: cover; background-position: center; background-blend-mode: ${esc(blendMode)};"`
        : '';
      const heroClick = p.audio_url
        ? ` onclick="(function(s){var a=s.querySelector('#hero-audio');if(!a)return;if(a.paused){a.play().catch(function(){});s.classList.add('audio-on');}else{a.pause();s.classList.remove('audio-on');}})(this)"`
        : '';
      return `
      <section class="hero ${p.image_url ? 'hero-with-image' : ''}${p.audio_url ? ' hero-tap' : ''}" ${bgStyle}${heroClick}>
        ${p.audio_url ? `<audio id="hero-audio" loop preload="none" src="${esc(p.audio_url)}"></audio>
        <div class="hero-bigplay" aria-hidden="true">
          <svg class="hero-hp" viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 60V47a54 44 0 0 1 108 0v13" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <rect x="6" y="52" width="26" height="44" rx="13" stroke="currentColor" stroke-width="4"/>
            <rect x="108" y="52" width="26" height="44" rx="13" stroke="currentColor" stroke-width="4"/>
            <path d="M62 41 L87 54 L62 67 Z" fill="rgba(246,230,200,0.5)" stroke="rgba(246,230,200,0.5)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </div>` : ''}
        <div class="hero-inner">
          ${p.label ? `<div class="hero-label">${esc(p.label)}</div>` : ''}
          <div class="hero-trait"></div>
          <h1>${esc(titreL1)}${titreH ? '<br>' + titreH : ''}${titreL2 ? '<br>' + esc(titreL2) : ''}</h1>
          ${p.sous_titre ? `<p class="hero-sub">${esc(p.sous_titre)}</p>` : ''}
          ${p.audio_url ? `<div class="hero-tap-cue">Au casque, touche l'écran pour entrer dans le son 8D</div>` : ''}
          ${p.meta ? `<p class="hero-meta">${esc(p.meta)}</p>` : ''}
          ${p.cta_texte ? `<a href="${esc(p.cta_lien || '#')}" class="hero-cta" onclick="event.stopPropagation()">${esc(p.cta_texte)}</a>` : ''}
        </div>
      </section>`;
    },
    beneficies(p) {
      const items = (p.items || []).map(item => `
        <div class="benefice">
          ${item.num ? `<div class="benefice-num">${esc(item.num)}</div>` : ''}
          ${item.titre ? `<h3>${esc(item.titre)}</h3>` : ''}
          ${item.texte ? `<p>${esc(item.texte)}</p>` : ''}
        </div>`).join('');
      return `
      <section class="beneficies">
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}

        </div>
      </section>`;
    },
    pour_qui(p) {
      const checks = (p.checks || []).map(c => `
        <div class="check">

          <div class="check-text">${esc(c)}</div>

      return `
      <section class="pour-qui">
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
          ${p.intro ? `<p class="pour-qui-intro">${esc(p.intro)}</p>` : ''}
          <div class="checks">${checks}</div>
        </div>
      </section>`;
    },
    temoignage(p) {
      const videoHtml = p.video_url ? `
        <div class="temoignage-video">
          <video controls preload="metadata" playsinline poster="${esc(p.poster_url || '')}">

            Ton navigateur ne supporte pas la lecture vidéo.

      return `
      <section class="temoignage">

          ${videoHtml}
          <div class="temoignage-bloc">
            ${p.texte ? `<p class="temoignage-texte">${esc(p.texte)}</p>` : ''}

    },
    a_propos(p) {
      const paragraphes = (p.paragraphes || []).map(par => `<p>${esc(par)}</p>`).join('');
      return `
      <section class="a-propos">
        <div class="container ${p.image_url ? 'a-propos-grid' : ''}">
          ${p.image_url ? `<div class="a-propos-image"><img src="${esc(p.image_url)}" alt="${esc(p.signature || 'Jérôme')}" loading="lazy"></div>` : ''}
          <div class="a-propos-text">
            ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
            ${paragraphes}
            ${p.signature ? `<p class="signature">${esc(p.signature)}</p>` : ''}
          </div>
        </div>
      </section>`;
    },
    cta_optin(p) {
      return `
      <section class="cta-final" id="${esc(p.id_ancre || 'optin')}">
        <div class="container">
          <h2>${esc(p.titre_ligne1 || '')}${p.titre_ligne2 ? '<br>' + esc(p.titre_ligne2) : ''}</h2>
          ${p.intro ? `<p>${esc(p.intro)}</p>` : ''}
          <div class="form-bloc">
            <form id="optin-form" data-tag="${esc(p.tag_brevo || 'lead_magnet')}" data-redirect="${esc(p.cta_lien || '')}" novalidate>
              <div class="form-row">
                <input class="form-input" type="text" name="prenom" placeholder="${esc(p.placeholder_prenom || 'Ton prénom')}" required>
                <input class="form-input" type="email" name="email" placeholder="${esc(p.placeholder_email || 'Ton email')}" required>
              </div>
              <button type="submit" class="form-cta">${esc(p.cta_texte || "S'inscrire")}</button>
            </form>
            ${p.rgpd ? `<p class="form-rgpd">${esc(p.rgpd)}</p>` : ''}
          </div>
        </div>
      </section>`;
    },
    garde_fous(p) {
      return `
      <section class="gardefous">
        <div class="gardefous-bloc">
          ${p.titre ? `<p class="gardefous-titre">${esc(p.titre)}</p>` : ''}
          ${p.texte ? `<p>${esc(p.texte)}</p>` : ''}
        </div>
      </section>`;
    },
    footer(p) {
      const liens = (p.liens || []).map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join(' · ');
      return `
      <footer>
        ${p.ligne1 ? `<div>${esc(p.ligne1)}</div>` : ''}
        <div class="footer-trait"></div>
        <div>${liens}</div>
        ${p.mentions ? `<p style="margin-top: 1rem; font-size: 0.75rem;">${esc(p.mentions)}</p>` : ''}
      </footer>`;
    },
    texte(p) {
      const paragraphes = (p.paragraphes || []).map(par => `<p>${esc(par)}</p>`).join('');
      return `
      <section class="texte-section">
        ${p.image_url ? `<div class="texte-image"><img src="${esc(p.image_url)}" alt="" loading="lazy"></div>` : ''}
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
          ${paragraphes}
        </div>
      </section>`;
    },

    programme(p) {
      const etapes = (p.etapes || []).map(e => `
        <div class="programme-etape">
          ${e.image_url ? `<div class="programme-image"><img src="${esc(e.image_url)}" alt="${esc(e.titre || '')}" loading="lazy"></div>` : ''}
          <div class="programme-content">
            ${e.numero ? `<div class="programme-num">${esc(e.numero)}</div>` : ''}
            ${e.titre ? `<h3>${esc(e.titre)}</h3>` : ''}
            ${e.sous_titre ? `<p class="programme-sous-titre">${esc(e.sous_titre)}</p>` : ''}
            ${e.objectif ? `<div class="programme-bloc"><div class="programme-label">Objectif</div><p>${esc(e.objectif)}</p></div>` : ''}
            ${e.au_programme ? `
              <div class="programme-bloc">
                <div class="programme-label">Au programme</div>
                <ul>${e.au_programme.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
              </div>` : ''}
            ${e.resultat ? `<div class="programme-bloc programme-resultat"><div class="programme-label">Résultat</div><p>${esc(e.resultat)}</p></div>` : ''}
          </div>
        </div>`).join('');
      return `
      <section class="programme-section">
        <div class="container container-large">
          ${p.titre ? `<h2 class="section-titre">${esc(p.titre)}</h2>` : ''}
          ${p.intro ? `<p class="section-intro">${esc(p.intro)}</p>` : ''}
          <div class="programme-grid">${etapes}</div>
        </div>

    },

    tarifs(p) {
      const inclus = (p.inclus || []).map(i => `
        <li>
          <span class="tarif-item-label">${esc(i.label || i)}</span>
          ${i.valeur ? `<span class="tarif-item-valeur">${esc(i.valeur)}</span>` : ''}
        </li>`).join('');
      return `
      <section class="tarif-section">
        <div class="container">
          ${p.titre ? `<h2 class="section-titre">${esc(p.titre)}</h2>` : ''}
          ${p.sous_titre ? `<p class="section-intro">${esc(p.sous_titre)}</p>` : ''}
          <div class="tarif-card">
            ${p.inclus_titre ? `<div class="tarif-section-titre">${esc(p.inclus_titre)}</div>` : ''}
            <ul class="tarif-liste">${inclus}</ul>
            ${p.valeur_totale ? `<div class="tarif-valeur-totale"><span>Valeur totale</span><strong>${esc(p.valeur_totale)}</strong></div>` : ''}
            <div class="tarif-prix-bloc">
              ${p.prix_normal ? `<div class="tarif-prix-normal">${esc(p.prix_normal)}</div>` : ''}
              ${p.prix_early ? `<div class="tarif-prix"><span class="tarif-prix-amount">${esc(p.prix_early)}</span>${p.early_label ? `<span class="tarif-prix-label">${esc(p.early_label)}</span>` : ''}</div>` : ''}
              ${p.modalites ? `<p class="tarif-modalites">${esc(p.modalites)}</p>` : ''}
            </div>
            ${p.option_titre ? `<div class="tarif-option"><span>${esc(p.option_titre)}</span><strong>${esc(p.option_prix || '')}</strong></div>` : ''}
            ${p.cta_texte ? `<a href="${esc(p.cta_lien || '#')}" class="tarif-cta" target="_blank" rel="noopener">${esc(p.cta_texte)}</a>` : ''}
          </div>
        </div>
      </section>`;
    },

    faq(p) {
      const cats = (p.categories || []).map(cat => `
        <div class="faq-cat">
          ${cat.label ? `<h3 class="faq-cat-titre">${esc(cat.label)}</h3>` : ''}
          ${(cat.questions || []).map(qa => `
            <details class="faq-item">
              <summary>${esc(qa.q)}</summary>
              <p>${esc(qa.r)}</p>
            </details>`).join('')}
        </div>`).join('');
      return `
      <section class="faq-section">
        <div class="container">
          ${p.titre ? `<h2 class="section-titre">${esc(p.titre)}</h2>` : ''}
          ${cats}
        </div>
      </section>`;
    },

    stats_count(p) {
      const items = (p.items || []).map(it => `
        <div class="stats-count-item">
          <span class="num" data-target="${esc(it.number || '0')}">${esc(it.prefix || '')}${esc(it.number || '0')}${esc(it.suffix || '')}</span>
          <span class="label">${esc(it.label || '')}</span>
        </div>`).join('');
      return `
      <section class="stats-count-section">
        <div class="container container-large">
          ${p.titre ? `<h2 class="section-titre">${esc(p.titre)}</h2>` : ''}
          <div class="stats-count-grid">${items}</div>
        </div>
      </section>`;
    },

    gallery(p) {
      const items = (p.images || []).map((img, i) => {
        const isFeature = i === 0 && p.feature_first;
        return `
        <div class="gallery-item ${isFeature ? 'feature' : ''}">
          <img src="${esc(img.url || img)}" alt="${esc(img.alt || '')}" loading="lazy">
        </div>`;
      }).join('');
      return `
      <section class="gallery-section">
        <div class="container container-large">
          ${p.titre ? `<h2 class="section-titre">${esc(p.titre)}</h2>` : ''}
          ${p.intro ? `<p class="section-intro">${esc(p.intro)}</p>` : ''}
          <div class="gallery-grid">${items}</div>
        </div>
      </section>`;
    }
  };

  async function loadPage() {
    const slug = getSlug();
    const subdomain = getSubdomain();
    document.title = 'Chargement... — Somatica';

    // Résolution de la page :
    // 1. Si slug explicite (?slug= ou path) → match par slug
    // 2. Sinon si sous-domaine → match par sous_domaine
    // 3. Sinon défaut absolu
    let pageQuery = supabase.from('sp_pages').select('*').eq('statut', 'publiee').limit(1);
    if (slug) {
      pageQuery = pageQuery.eq('slug', slug);
    } else if (subdomain) {
      pageQuery = pageQuery.eq('sous_domaine', subdomain);
    } else {
      pageQuery = pageQuery.eq('slug', 'reposer-systeme-nerveux');
    }
    const { data: pages, error: pageErr } = await pageQuery;
    const page = pages && pages.length ? pages[0] : null;

    if (pageErr || !page) {
      document.getElementById('page-content').innerHTML = `<div class="loader">Page introuvable.</div>`;
      console.error('Erreur page:', pageErr, 'slug:', slug, 'subdomain:', subdomain);
      return;
    }

    // Met à jour les meta
    document.title = page.meta_title || page.titre || 'Somatica';
    if (page.meta_description) document.getElementById('meta-desc').content = page.meta_description;
    if (page.theme_color) document.getElementById('meta-theme').content = page.theme_color;
    // Open Graph + Twitter (pour partages WhatsApp, FB, Twitter, etc.)
    var ogTitle = page.meta_title || page.titre || 'Somatica';
    var ogDesc = page.meta_description || '';
    var ogImage = page.og_image || 'https://pub-bdd518e07d1a4b6d8d21c0ed9e5015ac.r2.dev/iss-design/iss-og-1.png';
    var ogUrl = window.location.href;
    var setMeta = function(id, val) { var el = document.getElementById(id); if (el) el.content = val; };
    setMeta('meta-og-title', ogTitle);
    setMeta('meta-og-desc', ogDesc);
    setMeta('meta-og-image', ogImage);
    setMeta('meta-og-url', ogUrl);
    setMeta('meta-tw-title', ogTitle);
    setMeta('meta-tw-desc', ogDesc);
    setMeta('meta-tw-image', ogImage);
    // Track ViewISSPage côté Meta + GA4 si page tunnel logiciel
    if (page.tunnel === 'logiciel' && typeof window.fbq === 'function') {
      try { window.fbq('trackCustom', 'ViewISSPage', { slug: page.slug, type: page.type_page }); } catch(e){}
    }
    if (typeof window.gtag === 'function') {
      try { window.gtag('event', 'page_view', { page_title: ogTitle, page_location: ogUrl, page_path: window.location.pathname, tunnel: page.tunnel }); } catch(e){}
    }

    // Charge le template assigné à la page (table sp_templates)
    let template = null;
    if (page.template_id) {
      const { data: tpl } = await supabase
        .from('sp_templates')
        .select('slug, css_variables, css_custom')
        .eq('id', page.template_id)
        .single();
      template = tpl;
    }

    // Applique le template : injecte CSS vars + css_custom + class body
    if (template) {
      // 1. CSS variables sur :root
      const cssVars = template.css_variables || {};
      const varsString = Object.entries(cssVars).map(([k, v]) => `${k}: ${v};`).join(' ');
      let varsStyle = document.getElementById('tpl-vars');
      if (!varsStyle) { varsStyle = document.createElement('style'); varsStyle.id = 'tpl-vars'; document.head.appendChild(varsStyle); }
      varsStyle.textContent = `:root { ${varsString} }`;

      // 2. CSS custom
      let customStyle = document.getElementById('tpl-custom');
      if (!customStyle) { customStyle = document.createElement('style'); customStyle.id = 'tpl-custom'; document.head.appendChild(customStyle); }
      customStyle.textContent = template.css_custom || '';

      // 3. Class body pour le ciblage
      document.body.className = document.body.className.split(' ').filter(c => !c.startsWith('tpl-') && !c.startsWith('theme-')).join(' ');
      document.body.classList.add('tpl-' + template.slug);

      // 4. Compat rétro : garder theme-feminin si applicable
      if (template.slug === 'somatica-feminin') document.body.classList.add('theme-feminin');
    } else {
      // Fallback legacy : choix automatique du thème selon le tunnel
      if (page.tunnel === 'seances' || page.tunnel === 'formation') {
        document.body.classList.add('theme-feminin');
        document.getElementById('meta-theme').content = '#5d2837';
      } else {
        document.body.classList.remove('theme-feminin');
        document.getElementById('meta-theme').content = page.theme_color || '#1c2a30';
      }
    }

    // Récupère les blocs visibles, triés par ordre
    const { data: blocks, error: blocksErr } = await supabase
      .from('sp_blocks')
      .select('*')
      .eq('page_id', page.id)
      .eq('visible', true)
      .order('ordre', { ascending: true });

    if (blocksErr) {
      console.error('Erreur blocs:', blocksErr);
      document.getElementById('page-content').innerHTML = `<div class="loader">Erreur de chargement.</div>`;
      return;
    }

    // Identifier les types personnalisés (pas dans renderers hardcodés JS)
    const customTypes = (blocks || []).filter(b => !renderers[b.type_bloc]).map(b => b.type_bloc);
    let customTypesMap = {};
    if (customTypes.length) {
      const { data: customDefs } = await supabase
        .from('sp_block_types')
        .select('slug, html_template, css_scoped, js_scoped')
        .in('slug', [...new Set(customTypes)]);
      (customDefs || []).forEach(d => { customTypesMap[d.slug] = d; });
      // Injecte le CSS scoped des types custom
      const cssCustom = (customDefs || []).map(d => d.css_scoped || '').filter(Boolean).join('\n');
      if (cssCustom) {
        let style = document.getElementById('block-types-css');
        if (!style) { style = document.createElement('style'); style.id = 'block-types-css'; document.head.appendChild(style); }
        style.textContent = cssCustom;
      }
    }

    // Render les blocs
    const html = (blocks || []).map(b => {
      const renderer = renderers[b.type_bloc];
      if (renderer) {
        // Type hardcodé JS (chemin existant, zéro régression)
        try { return renderer(b.props || {}); }
        catch (e) { console.error('Erreur render bloc', b.type_bloc, e); return ''; }
      }
      // Type custom : compile le template HTML avec les props
      const def = customTypesMap[b.type_bloc];
      if (!def) {
        console.warn('Type bloc inconnu (ni JS ni DB):', b.type_bloc);
        return '<section style="padding:1rem;background:#fee;color:#900;">Bloc inconnu : ' + esc(b.type_bloc) + '</section>';
      }
      try {
        const compiled = renderCustomBlock(def.html_template, b.props || {});
        // Marqueur data-block-id pour permettre au JS scoped de cibler son bloc
        return `<div data-block-id="${esc(b.id)}" data-block-type="${esc(b.type_bloc)}">${compiled}</div>`;
      }
      catch (e) { console.error('Erreur render custom', b.type_bloc, e); return ''; }
    }).join('');

    document.getElementById('page-content').innerHTML = html;
    setupOptinForm();
    setupAnimations();
    setupStickyNav(blocks || []);
    setupScrollProgress();
    setupCounters();

    // Exécute le JS scoped des blocs custom après injection DOM
    (blocks || []).forEach(b => {
      const def = customTypesMap[b.type_bloc];
      if (!def || !def.js_scoped) return;
      const blockEl = document.querySelector('[data-block-id="' + b.id + '"]');
      if (!blockEl) return;
      try {
        // Sandbox basique : on expose block (DOM), props (data), et helpers utiles
        const fn = new Function('block', 'props', 'helpers', def.js_scoped);
        const helpers = {
          $: (sel) => blockEl.querySelector(sel),
          $$: (sel) => Array.from(blockEl.querySelectorAll(sel)),
          on: (sel, evt, cb) => blockEl.querySelectorAll(sel).forEach(el => el.addEventListener(evt, cb)),
        };
        fn(blockEl, b.props || {}, helpers);
      } catch (e) {
        console.error('Erreur JS scoped pour bloc', b.type_bloc, e);
      }
    });
  }

  // ============ ANIMATIONS ============
  function setupAnimations() {
    const sections = document.querySelectorAll('section');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
    sections.forEach(s => {
      if (!s.classList.contains('hero')) {
        s.classList.add('fade-in-section');
        observer.observe(s);
      }
    });
  }

  // ============ STICKY NAV ============
  function setupStickyNav(blocks) {
    // Construit la nav selon les types de blocs présents
    const navItems = [];
    const sectionMap = { programme: 'Programme', temoignage: 'Témoignages', tarifs: 'Tarif', faq: 'FAQ', cta_optin: 'Réserver' };
    const seenTypes = new Set();
    const sections = document.querySelectorAll('section');
    let i = 0;
    blocks.forEach(b => {
      if (sectionMap[b.type_bloc] && !seenTypes.has(b.type_bloc)) {
        seenTypes.add(b.type_bloc);
        if (sections[i]) {
          const id = `nav-${b.type_bloc}`;
          sections[i].id = id;
          navItems.push({ id, label: sectionMap[b.type_bloc], cta: b.type_bloc === 'cta_optin' });
        }
      }
      i++;
    });
    if (navItems.length === 0) return;

    const nav = document.createElement('nav');
    nav.className = 'sticky-nav';
    nav.innerHTML = `<div class="sticky-nav-inner">${navItems.map(n => `<a href="#${n.id}" class="${n.cta ? 'cta' : ''}">${esc(n.label)}</a>`).join('')}</div>`;
    document.body.appendChild(nav);

    // Show nav after scrolling past hero
    const showAfter = window.innerHeight * 0.7;
    window.addEventListener('scroll', () => {
      if (window.scrollY > showAfter) nav.classList.add('visible');
      else nav.classList.remove('visible');
    });
  }

  // ============ SCROLL PROGRESS BAR ============
  function setupScrollProgress() {
    const bar = document.createElement('div');
    bar.className = 'scroll-progress';
    document.body.appendChild(bar);
    window.addEventListener('scroll', () => {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
      bar.style.width = `${progress}%`;
    });
  }

  // ============ COMPTEURS ANIMÉS ============
  function setupCounters() {
    const nums = document.querySelectorAll('.stats-count-item .num');
    if (!nums.length) return;
    const animateNum = (el) => {
      const target = parseInt(String(el.dataset.target || '0').replace(/\D/g, ''), 10);
      const prefix = (el.textContent.match(/^[^\d]*/) || [''])[0];
      const suffix = (el.textContent.match(/[^\d]*$/) || [''])[0];
      if (!target) return;
      const duration = 1600;
      const start = performance.now();
      const tick = (now) => {
        const elapsed = now - start;
        const ratio = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - ratio, 3);
        const current = Math.floor(target * eased);
        el.textContent = `${prefix}${current.toLocaleString('fr-FR')}${suffix}`;
        if (ratio < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateNum(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    nums.forEach(n => observer.observe(n));
  }

  function setupOptinForm() {
    const form = document.getElementById('optin-form');
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const prenom = (fd.get('prenom') || '').toString().trim();
      const email = (fd.get('email') || '').toString().trim().toLowerCase();
      const tag = form.dataset.tag || '';
      const btn = form.querySelector('button[type="submit"]');
      const originalLabel = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Envoi en cours...'; }

      try {
        const res = await fetch('https://kvtfxnogdzseesorqwqp.supabase.co/functions/v1/subscribe-to-sequence', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email, prenom, tunnel: tag, source: 'opt_in_' + (window.location.hostname || 'page'),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok && res.status !== 404) {
          throw new Error(data.error || 'Erreur ' + res.status);
        }
        // 404 (aucune séquence pour ce tunnel) = non bloquant, on remercie quand même
        const redirectUrl = form.dataset.redirect;
        if (redirectUrl && redirectUrl.startsWith('http')) {
          // Si un lien externe est défini (Calendly, Wix Bookings, etc.), on redirige
          form.innerHTML = '<div style="text-align:center;padding:1.5rem;font-size:1.05rem;color:var(--dore-fonce);">Merci ' + prenom + '. Redirection vers le calendrier...</div>';
          setTimeout(() => { window.location.href = redirectUrl; }, 800);
        } else {
          form.innerHTML = '<div style="text-align:center;padding:1.5rem;font-size:1.05rem;color:var(--dore-fonce);">Merci ' + prenom + '. Tu vas recevoir un email dans la minute avec ton accès.</div>';
        }
      } catch (err) {
        if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
        alert('Désolé, une erreur est survenue : ' + (err.message || err) + '. Réessaie ou écris-moi sur WhatsApp.');
      }
    });
  }

  loadPage();
</script>
