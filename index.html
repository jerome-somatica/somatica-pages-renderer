<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1c2a30" id="meta-theme">
<title>Somatica</title>
<meta name="description" content="" id="meta-desc">
<style>
  :root {
    --dore-fonce: #8a6d2e;
    --dore-clair: #ebd3a0;
    --vert-sombre: #0f2f3a;
    --fond-sombre: #1c2a30;
    --fond-creme: #f5efe2;
    --texte: #1a1a1a;
    --gris: #4a4a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--fond-creme);
    color: var(--texte);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* HERO */
  .hero { background: var(--fond-sombre); color: var(--dore-clair); padding: 6rem 1.5rem 5rem; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at top, rgba(138, 109, 46, 0.15), transparent 60%); pointer-events: none; }
  .hero-inner { position: relative; max-width: 720px; margin: 0 auto; }
  .hero-label { font-size: 0.85rem; letter-spacing: 0.2em; color: var(--dore-fonce); font-weight: 700; margin-bottom: 1rem; }
  .hero-trait { width: 3rem; height: 1.5px; background: var(--dore-fonce); margin: 0 auto 1.8rem; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; color: var(--dore-clair); line-height: 1.2; margin-bottom: 1.2rem; letter-spacing: -0.01em; }
  .hero h1 .highlight { color: var(--dore-fonce); font-style: italic; font-weight: 500; }
  .hero-sub { font-size: clamp(1rem, 2vw, 1.25rem); color: rgba(235, 211, 160, 0.85); margin-bottom: 2.5rem; line-height: 1.6; }
  .hero-cta { display: inline-block; background: var(--dore-fonce); color: var(--vert-sombre); padding: 1rem 2.2rem; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; transition: transform 0.2s, background 0.2s; border: 0; cursor: pointer; }
  .hero-cta:hover, .hero-cta:focus { background: var(--dore-clair); transform: translateY(-1px); }
  .hero-meta { margin-top: 1.5rem; font-size: 0.85rem; color: rgba(235, 211, 160, 0.55); font-style: italic; }

  section { padding: 4rem 1.5rem; }
  .container { max-width: 720px; margin: 0 auto; }

  /* Bénéfices */
  .beneficies { background: var(--fond-creme); }
  .beneficies h2 { font-size: 1.8rem; color: var(--vert-sombre); text-align: center; margin-bottom: 0.8rem; font-weight: 700; }
  .beneficies-intro { text-align: center; color: var(--gris); margin-bottom: 3rem; font-size: 1.05rem; }
  .beneficies-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 720px) { .beneficies-grid { grid-template-columns: repeat(3, 1fr); } }
  .benefice { background: white; padding: 2rem 1.5rem; border-radius: 6px; border-top: 3px solid var(--dore-fonce); text-align: left; }
  .benefice-num { font-size: 0.8rem; letter-spacing: 0.15em; color: var(--dore-fonce); font-weight: 700; margin-bottom: 0.8rem; }
  .benefice h3 { font-size: 1.15rem; color: var(--vert-sombre); margin-bottom: 0.7rem; font-weight: 700; }
  .benefice p { color: var(--gris); font-size: 0.95rem; line-height: 1.6; }

  /* Pour qui */
  .pour-qui { background: var(--vert-sombre); color: var(--dore-clair); text-align: center; }
  .pour-qui h2 { color: var(--dore-clair); font-size: 1.8rem; margin-bottom: 0.8rem; font-weight: 700; }
  .pour-qui-intro { color: rgba(235, 211, 160, 0.75); margin-bottom: 2.5rem; font-size: 1.05rem; }
  .checks { text-align: left; max-width: 540px; margin: 0 auto; }
  .check { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid rgba(235, 211, 160, 0.12); }
  .check:last-child { border-bottom: none; }
  .check-icon { flex-shrink: 0; width: 22px; height: 22px; background: var(--dore-fonce); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--vert-sombre); font-weight: 700; font-size: 0.85rem; margin-top: 0.15rem; }
  .check-text { color: rgba(235, 211, 160, 0.9); font-size: 1rem; line-height: 1.6; }

  /* Témoignage */
  .temoignage { background: var(--fond-creme); text-align: center; }
  .temoignage-bloc { border-left: 3px solid var(--dore-fonce); padding: 1.5rem 0 1.5rem 1.5rem; margin: 0 auto; max-width: 600px; text-align: left; }
  .temoignage-texte { font-size: 1.15rem; color: var(--vert-sombre); font-style: italic; line-height: 1.7; margin-bottom: 1rem; }
  .temoignage-auteur { color: var(--dore-fonce); font-weight: 700; font-size: 0.9rem; letter-spacing: 0.02em; }
  .temoignage-video { max-width: 600px; margin: 0 auto 2rem; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(15, 47, 58, 0.12); }
  .temoignage-video video { width: 100%; height: auto; display: block; background: var(--vert-sombre); }

  /* À propos */
  .a-propos { background: white; text-align: center; }
  .a-propos h2 { font-size: 1.8rem; color: var(--vert-sombre); margin-bottom: 1.5rem; font-weight: 700; }
  .a-propos p { color: var(--gris); font-size: 1.05rem; line-height: 1.75; max-width: 580px; margin: 0 auto 1.2rem; }
  .signature { margin-top: 2rem; color: var(--dore-fonce); font-weight: 700; font-style: italic; }

  /* CTA Final */
  .cta-final { background: var(--vert-sombre); text-align: center; color: var(--dore-clair); }
  .cta-final h2 { color: var(--dore-clair); font-size: clamp(1.6rem, 4vw, 2.2rem); margin-bottom: 1.2rem; font-weight: 700; line-height: 1.3; }
  .cta-final p { color: rgba(235, 211, 160, 0.8); margin-bottom: 2rem; font-size: 1.05rem; max-width: 540px; margin-left: auto; margin-right: auto; }
  .form-bloc { max-width: 460px; margin: 0 auto; }
  .form-row { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 0.8rem; }
  .form-input { padding: 1rem 1.2rem; border: 1px solid rgba(235, 211, 160, 0.25); background: rgba(245, 239, 226, 0.08); color: var(--dore-clair); border-radius: 4px; font-size: 1rem; font-family: inherit; transition: border 0.2s, background 0.2s; }
  .form-input::placeholder { color: rgba(235, 211, 160, 0.4); }
  .form-input:focus { outline: none; border-color: var(--dore-fonce); background: rgba(245, 239, 226, 0.12); }
  .form-cta { background: var(--dore-fonce); color: var(--vert-sombre); border: 0; padding: 1.05rem 2rem; border-radius: 4px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: background 0.2s, transform 0.2s; font-family: inherit; }
  .form-cta:hover, .form-cta:focus { background: var(--dore-clair); transform: translateY(-1px); }
  .form-rgpd { margin-top: 1rem; font-size: 0.8rem; color: rgba(235, 211, 160, 0.5); line-height: 1.5; }

  /* Garde-fous */
  .gardefous { background: var(--fond-creme); text-align: center; padding: 3rem 1.5rem; }
  .gardefous-bloc { max-width: 580px; margin: 0 auto; border: 1px solid rgba(138, 109, 46, 0.2); border-radius: 6px; padding: 1.8rem 1.5rem; background: white; text-align: left; }
  .gardefous-titre { color: var(--dore-fonce); font-size: 0.85rem; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 0.7rem; }
  .gardefous p { color: var(--gris); font-size: 0.92rem; line-height: 1.65; }

  /* Footer */
  footer { background: var(--vert-sombre); padding: 2.5rem 1.5rem; text-align: center; color: rgba(235, 211, 160, 0.6); font-size: 0.85rem; }
  footer a { color: var(--dore-clair); text-decoration: none; }
  .footer-trait { width: 2rem; height: 1px; background: var(--dore-fonce); margin: 1rem auto; }

  /* Texte bloc */
  .texte-section { background: var(--fond-creme); }
  .texte-section h2 { font-size: 1.8rem; color: var(--vert-sombre); margin-bottom: 1.5rem; }
  .texte-section p { color: var(--gris); margin-bottom: 1rem; }

  /* Loading */
  .loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--gris); font-style: italic; }
</style>
</head>
<body>

<div id="page-content">
  <div class="loader">Chargement...</div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.0';

  const SUPABASE_URL = 'https://zrdlvoovrnglxcgoyyeb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ukrn7WQHygY5FUtNiMxxfA_E-esyAUs';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Récupère le slug depuis l'URL ou par défaut
  function getSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    const slugParam = urlParams.get('slug');
    if (slugParam) return slugParam;
    // Fallback sur le sous-domaine ou path
    const path = window.location.pathname.replace(/^\/|\/$/g, '');
    if (path) return path;
    return 'reposer-systeme-nerveux';
  }

  // Échappement HTML basique
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // Renderers par type de bloc
  const renderers = {
    hero(p) {
      const titreL1 = p.titre_ligne1 || '';
      const titreH = p.titre_highlight ? `<span class="highlight">${esc(p.titre_highlight)}</span>` : '';
      const titreL2 = p.titre_ligne2 || '';
      return `
      <section class="hero">
        <div class="hero-inner">
          ${p.label ? `<div class="hero-label">${esc(p.label)}</div>` : ''}
          <div class="hero-trait"></div>
          <h1>${esc(titreL1)}${titreH ? '<br>' + titreH : ''}${titreL2 ? '<br>' + esc(titreL2) : ''}</h1>
          ${p.sous_titre ? `<p class="hero-sub">${esc(p.sous_titre)}</p>` : ''}
          ${p.cta_texte ? `<a href="${esc(p.cta_lien || '#')}" class="hero-cta">${esc(p.cta_texte)}</a>` : ''}
          ${p.meta ? `<p class="hero-meta">${esc(p.meta)}</p>` : ''}
        </div>
      </section>`;
    },
    beneficies(p) {
      const items = (p.items || []).map(item => `
        <div class="benefice">
          ${item.num ? `<div class="benefice-num">${esc(item.num)}</div>` : ''}
          ${item.titre ? `<h3>${esc(item.titre)}</h3>` : ''}
          ${item.texte ? `<p>${esc(item.texte)}</p>` : ''}
        </div>`).join('');
      return `
      <section class="beneficies">
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
          ${p.intro ? `<p class="beneficies-intro">${esc(p.intro)}</p>` : ''}
          <div class="beneficies-grid">${items}</div>
        </div>
      </section>`;
    },
    pour_qui(p) {
      const checks = (p.checks || []).map(c => `
        <div class="check">
          <div class="check-icon">✓</div>
          <div class="check-text">${esc(c)}</div>
        </div>`).join('');
      return `
      <section class="pour-qui">
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
          ${p.intro ? `<p class="pour-qui-intro">${esc(p.intro)}</p>` : ''}
          <div class="checks">${checks}</div>
        </div>
      </section>`;
    },
    temoignage(p) {
      const videoHtml = p.video_url ? `
        <div class="temoignage-video">
          <video controls preload="metadata" playsinline poster="${esc(p.poster_url || '')}">
            <source src="${esc(p.video_url)}" type="video/mp4">
            Ton navigateur ne supporte pas la lecture vidéo.
          </video>
        </div>` : '';
      return `
      <section class="temoignage">
        <div class="container">
          ${videoHtml}
          <div class="temoignage-bloc">
            ${p.texte ? `<p class="temoignage-texte">${esc(p.texte)}</p>` : ''}
            ${p.auteur ? `<p class="temoignage-auteur">— ${esc(p.auteur)}</p>` : ''}
          </div>
        </div>
      </section>`;
    },
    a_propos(p) {
      const paragraphes = (p.paragraphes || []).map(par => `<p>${esc(par)}</p>`).join('');
      return `
      <section class="a-propos">
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
          ${paragraphes}
          ${p.signature ? `<p class="signature">${esc(p.signature)}</p>` : ''}
        </div>
      </section>`;
    },
    cta_optin(p) {
      return `
      <section class="cta-final" id="${esc(p.id_ancre || 'optin')}">
        <div class="container">
          <h2>${esc(p.titre_ligne1 || '')}${p.titre_ligne2 ? '<br>' + esc(p.titre_ligne2) : ''}</h2>
          ${p.intro ? `<p>${esc(p.intro)}</p>` : ''}
          <div class="form-bloc">
            <form id="optin-form" data-tag="${esc(p.tag_brevo || 'lead_magnet')}" novalidate>
              <div class="form-row">
                <input class="form-input" type="text" name="prenom" placeholder="${esc(p.placeholder_prenom || 'Ton prénom')}" required>
                <input class="form-input" type="email" name="email" placeholder="${esc(p.placeholder_email || 'Ton email')}" required>
              </div>
              <button type="submit" class="form-cta">${esc(p.cta_texte || "S'inscrire")}</button>
            </form>
            ${p.rgpd ? `<p class="form-rgpd">${esc(p.rgpd)}</p>` : ''}
          </div>
        </div>
      </section>`;
    },
    garde_fous(p) {
      return `
      <section class="gardefous">
        <div class="gardefous-bloc">
          ${p.titre ? `<p class="gardefous-titre">${esc(p.titre)}</p>` : ''}
          ${p.texte ? `<p>${esc(p.texte)}</p>` : ''}
        </div>
      </section>`;
    },
    footer(p) {
      const liens = (p.liens || []).map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join(' · ');
      return `
      <footer>
        ${p.ligne1 ? `<div>${esc(p.ligne1)}</div>` : ''}
        <div class="footer-trait"></div>
        <div>${liens}</div>
        ${p.mentions ? `<p style="margin-top: 1rem; font-size: 0.75rem;">${esc(p.mentions)}</p>` : ''}
      </footer>`;
    },
    texte(p) {
      const paragraphes = (p.paragraphes || []).map(par => `<p>${esc(par)}</p>`).join('');
      return `
      <section class="texte-section">
        <div class="container">
          ${p.titre ? `<h2>${esc(p.titre)}</h2>` : ''}
          ${paragraphes}
        </div>
      </section>`;
    }
  };

  async function loadPage() {
    const slug = getSlug();
    document.title = 'Chargement... — Somatica';

    // Récupère la page
    const { data: page, error: pageErr } = await supabase
      .from('sp_pages')
      .select('*')
      .eq('slug', slug)
      .single();

    if (pageErr || !page) {
      document.getElementById('page-content').innerHTML = `<div class="loader">Page introuvable.</div>`;
      console.error('Erreur page:', pageErr);
      return;
    }

    // Met à jour les meta
    document.title = page.meta_title || page.titre || 'Somatica';
    if (page.meta_description) document.getElementById('meta-desc').content = page.meta_description;
    if (page.theme_color) document.getElementById('meta-theme').content = page.theme_color;

    // Récupère les blocs visibles, triés par ordre
    const { data: blocks, error: blocksErr } = await supabase
      .from('sp_blocks')
      .select('*')
      .eq('page_id', page.id)
      .eq('visible', true)
      .order('ordre', { ascending: true });

    if (blocksErr) {
      console.error('Erreur blocs:', blocksErr);
      document.getElementById('page-content').innerHTML = `<div class="loader">Erreur de chargement.</div>`;
      return;
    }

    // Render les blocs
    const html = (blocks || []).map(b => {
      const renderer = renderers[b.type_bloc];
      if (!renderer) {
        console.warn('Renderer inconnu pour type:', b.type_bloc);
        return '';
      }
      try {
        return renderer(b.props || {});
      } catch (e) {
        console.error('Erreur render bloc', b.type_bloc, e);
        return '';
      }
    }).join('');

    document.getElementById('page-content').innerHTML = html;
    setupOptinForm();
  }

  function setupOptinForm() {
    const form = document.getElementById('optin-form');
    if (!form) return;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const prenom = fd.get('prenom');
      const email = fd.get('email');
      const tag = form.dataset.tag;
      // TODO: connecter à Brevo via Edge Function
      // fetch('https://zrdlvoovrnglxcgoyyeb.supabase.co/functions/v1/optin-leadmagnet', {
      //   method: 'POST',
      //   headers: {'Content-Type': 'application/json'},
      //   body: JSON.stringify({ prenom, email, tag })
      // });
      alert(`Merci ${prenom} ! (démo, à connecter à Brevo)`);
    });
  }

  loadPage();
</script>

</body>
</html>
